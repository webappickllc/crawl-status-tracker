name: Automated GSC Crawl Tracker

on:
  schedule:
    # Runs automatically every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to run it manually anytime from the GitHub UI

jobs:
  update-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth

      - name: Create service account credentials file
        env:
          GSC_CREDS: ${{ secrets.GSC_CREDENTIALS }}
        run: |
          python -c 'import os; open("service-account.json", "w", encoding="utf-8").write(os.environ["GSC_CREDS"])'

      - name: Run crawl status generator
        run: |
          python generate_crawl_status.py \
            --credentials service-account.json \
            --site-url "https://dailyshikkha.com/" \
            --sitemap https://dailyshikkha.com/sitemap.xml \
            --output data.json

      - name: Commit and push changes if data updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update GSC crawl status data [skip ci]" && git push)
